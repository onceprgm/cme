<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="100%" role="img" aria-labelledby="t d" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">cme — minimal Minecraft launcher for Linux</title>
  <desc id="d">A terminal-style hero: the cme wordmark with a grass-block mark, and a sample command session installing and launching Minecraft with Fabric.</desc>

  <rect x="2" y="2" width="1276" height="456" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- grass-block mark -->
  <g>
    <polygon points="108,64 148,84 108,104 68,84" fill="#7ec44f"/>
    <polygon points="68,84 108,104 108,150 68,130" fill="#6b4a2f"/>
    <polygon points="148,84 108,104 108,150 148,130" fill="#55391f"/>
    <polygon points="68,84 108,104 108,114 68,94" fill="#7ec44f"/>
    <polygon points="148,84 108,104 108,114 148,94" fill="#5f9e3a"/>
  </g>

  <!-- wordmark + horizontal cursor -->
  <text x="54" y="288" font-size="132" font-weight="700" fill="#7bd45a" letter-spacing="-4">cme</text>
  <rect x="306" y="272" width="76" height="18" rx="3" fill="#7bd45a" opacity="0.85"/>

  <text x="60" y="334" font-size="26" fill="#c9d1d9" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">minimal Minecraft launcher for Linux</text>
  <text x="60" y="372" font-size="18" fill="#8b949e" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">zero dependencies &#183; offline-ready &#183; scriptable</text>

  <!-- terminal window -->
  <rect x="708" y="60" width="516" height="340" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="734" cy="88" r="7" fill="#ff5f56"/>
  <circle cx="756" cy="88" r="7" fill="#febc2e"/>
  <circle cx="778" cy="88" r="7" fill="#28c840"/>
  <text x="966" y="93" font-size="17" fill="#6e7681" text-anchor="middle">cme</text>
  <line x1="708" y1="116" x2="1224" y2="116" stroke="#21262d" stroke-width="1.5"/>

  <text x="736" y="170" font-size="24"><tspan fill="#7bd45a">&#10095; </tspan><tspan fill="#c9d1d9">cme install fabric 1.21.4</tspan></text>
  <text x="736" y="216" font-size="24"><tspan fill="#7bd45a">&#10003; </tspan><tspan fill="#8b949e">installed (requires java 21)</tspan></text>
  <text x="736" y="262" font-size="24"><tspan fill="#7bd45a">&#10095; </tspan><tspan fill="#c9d1d9">cme launch fabric 1.21.4 </tspan><tspan fill="#6e7681">\</tspan></text>
  <text x="736" y="308" font-size="24" fill="#c9d1d9">--username Steve --ram 4</text>
  <text x="736" y="354" font-size="24"><tspan fill="#6e7681">&#8594; </tspan><tspan fill="#8b949e">launching&#8230;</tspan></text>
</svg>

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/cme ./cmd/cme

      - name: Package
        run: |
          archive="cme-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          tar -C dist -czf "dist/${archive}" cme
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
